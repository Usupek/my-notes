services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notes}
      POSTGRES_USER: ${POSTGRES_USER:-notes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  migrate:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./services/api/migrations:/migrations:ro
    command: ["sh", "-c", "psql -h db -U ${POSTGRES_USER:-notes} -d ${POSTGRES_DB:-notes} -v ON_ERROR_STOP=1 -f /migrations/001_init.sql"]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  api:
    build: ./services/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-notes}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-notes}?sslmode=disable
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH in .env}
      SESSION_TTL: ${SESSION_TTL:-24h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
      STORAGE_DIR: /app/data/notes
      MAX_MARKDOWN_BYTES: ${MAX_MARKDOWN_BYTES:-1048576}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-5242880}
    volumes:
      - notes_storage:/app/data/notes
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/v1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8080
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web, api]
    networks: [internal]

volumes:
  postgres_data:
  notes_storage:

networks:
  internal:
    driver: bridge
